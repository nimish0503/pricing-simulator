    "124": High
    "126": Medium
    "128": High
  extra_columns: [income, educ, ethnic, hsizeavg, age60]

# Dominick's reports no feature or display flags. The manual says SALE is not set
# consistently, so price cuts without a code are caught by the depth rule in modeling.yaml.
promo:
  price_cut: "sale IN ('B', 'C', 'S')"

selection:
  # Weeks 192 to 399. The chain has no data for weeks 284-309.
  last_weeks: 208
  top_n_products: 25
  private_label_top_n: 3
  min_weeks_observed: 100

cost:
  # PROFIT is gross margin in percent on average acquisition cost (manual, part 4).
  unit_cost_expr: "CASE WHEN profit > 0 AND profit < 100 THEN unit_price * (1 - profit / 100) END"
