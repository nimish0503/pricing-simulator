[project]
name = "shelfsim"
version = "0.1.0"
description = "Onboard retail scanner data, estimate elasticities, simulate choice and optimize prices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "jinja2",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "pandera[polars]",
    "plotly",
    "polars",
    "pyarrow",
    "pydantic",
    "pymc",
    "pyyaml",
    "scikit-learn",
    "scipy>=1.16",
    "statsmodels",
    "streamlit",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsim"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
